# USBPI buffered HID mirror.
#
# HID devices (keyboards, mice, ...) are kept on the Pi's own usbhid, their
# reports are queued locally and replayed through a virtual USB device so the
# client never loses key transitions to network hiccups.  Devices listed in
# `exclude` are left alone and exported the old way (usbip-host, no buffering).
#
#   enabled      1/0  - master switch (default 1)
#   queue_limit  N    - reports buffered per HID interface while the client is
#                       away; oldest are dropped with a warning (default 65536)
#   rescan_ms    N    - sysfs scan interval, 200..60000 (default 2000)
#   exclude      list - vendor:product pairs, space separated, e.g.
#                       exclude = 046d:c539 1234:5678

enabled = 1
queue_limit = 65536
rescan_ms = 2000
