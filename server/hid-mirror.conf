# USBPI buffered HID mirror.
#
# HID devices (keyboards, mice, ...) are kept on the Pi's own usbhid, their
# reports are queued locally and replayed through a virtual USB device so the
# client never loses key transitions to network hiccups.  Devices listed in
# `exclude` are left alone and exported the old way (usbip-host, no buffering).
#
#   enabled      1/0  - master switch (default 1)
#   keyboard     1/0  - keyboard fast path over TCP + uinput (default 1);
#                       0 falls back to the legacy buffered HID gadget
#   queue_limit  N    - legacy-path reports buffered per HID interface while
#                       the client is away (default 4096)
#   rescan_ms    N    - fallback sysfs scan interval, 200..60000 (default 2000;
#                       kernel uevents trigger immediate full scans)
#   exclude      list - vendor:product pairs left on plain USB/IP, e.g.
#                       exclude = 046d:c539 1234:5678

enabled = 1
keyboard = 1
queue_limit = 4096
rescan_ms = 2000
